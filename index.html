<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="HFJV压力单位转换器，支持MPa、bar、psi、kPa、cmH₂O">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>HFJV压力转换器</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(145deg,#eef5ff,#f7faff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#172033}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 40px}
.card{background:#fff;border-radius:24px;padding:30px;box-shadow:0 12px 40px rgba(35,82,160,.12)}
h1{margin:0;color:#2563eb;font-size:30px}
.sub{margin:8px 0 28px;color:#6b7a90;font-size:15px}
label{display:block;font-weight:700;margin:16px 0 8px}
input,select{width:100%;height:58px;border:1px solid #d5dfef;border-radius:15px;padding:0 16px;font-size:18px;background:#fff;color:#172033;outline:none}
input:focus,select:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.row{display:grid;grid-template-columns:1fr 64px 1fr;gap:12px;align-items:end}
.swap{height:58px;border:0;border-radius:15px;background:#eaf1ff;color:#2563eb;font-size:30px;cursor:pointer}
button.convert{width:100%;height:58px;border:0;border-radius:15px;background:#2563eb;color:#fff;font-size:20px;font-weight:700;margin-top:26px;cursor:pointer}
.result{margin-top:24px;padding:24px;border-radius:20px;background:#eef6ff;border:1px solid #d7e8ff}
.result-title{color:#71809a;font-size:15px}
.value{margin:8px 0 16px;color:#2454c6;font-size:31px;font-weight:800;word-break:break-word}
.copy{height:44px;padding:0 18px;border:1px solid #9fc2ff;border-radius:12px;background:#fff;color:#2563eb;font-size:15px;cursor:pointer}
.note{margin-top:24px;color:#71809a;font-size:13px;line-height:1.7}
@media(max-width:520px){.card{padding:22px;border-radius:20px}h1{font-size:26px}.row{grid-template-columns:1fr 52px 1fr;gap:8px}.swap{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>HFJV 压力单位转换器</h1>
<div class="sub">支持 MPa · bar · psi · kPa · cmH₂O</div>

<label for="num">输入数值</label>
<input id="num" type="number" inputmode="decimal" step="any" value="25" placeholder="请输入数值">

<div class="row">
<div><label for="from">原单位</label><select id="from"></select></div>
<button class="swap" id="swap" aria-label="交换单位">⇄</button>
<div><label for="to">目标单位</label><select id="to"></select></div>
</div>

<button class="convert" id="convert">转换</button>

<div class="result">
<div class="result-title">转换结果</div>
<div class="value" id="result">—</div>
<button class="copy" id="copy">复制结果</button>
</div>


<div class="note">
换算基准：1 MPa = 10 bar = 1000 kPa = 145.037738 psi = 1019.716213 cmH₂O
</div>
</div>
</div>
<script>
const units={
  MPa:1,
  bar:0.1,
  kPa:0.001,
  psi:1/145.037738,
  "cmH₂O":1/1019.716213
};
const from=document.getElementById("from"),to=document.getElementById("to"),num=document.getElementById("num"),result=document.getElementById("result");
Object.keys(units).forEach(u=>{from.add(new Option(u,u));to.add(new Option(u,u));});
from.value="psi";to.value="MPa";
function convert(){
 const n=Number(num.value);
 if(!Number.isFinite(n)){result.textContent="请输入有效数值";return;}
 const v=n*units[from.value]/units[to.value];
 result.textContent=v.toPrecision(10).replace(/\.?0+$/,"")+" "+to.value;
}
document.getElementById("convert").onclick=convert;
document.getElementById("swap").onclick=()=>{const x=from.value;from.value=to.value;to.value=x;convert();};
document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(result.textContent);document.getElementById("copy").textContent="已复制";setTimeout(()=>document.getElementById("copy").textContent="复制结果",1200)}catch(e){}};
num.addEventListener("keydown",e=>{if(e.key==="Enter")convert()});
convert();

if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script>
</body>
</html>

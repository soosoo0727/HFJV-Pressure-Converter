<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<title>HFJV压力单位转换器</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#1f2937;background:#f5f7fb}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:linear-gradient(#eef5ff,#f7f9fc)}
.app{max-width:560px;margin:0 auto;padding:28px 18px 40px}
.card{background:white;border-radius:22px;padding:22px;box-shadow:0 8px 30px rgba(15,23,42,.08)}
h1{font-size:24px;margin:0 0 6px;color:#1d4ed8} .sub{color:#64748b;font-size:14px;margin-bottom:22px}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 7px}
input,select{width:100%;height:52px;border:1px solid #d7dee9;border-radius:13px;padding:0 14px;font-size:18px;background:#fff;outline:none}
input:focus,select:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.row{display:grid;grid-template-columns:1fr 52px 1fr;gap:10px;align-items:end}
.swap{height:52px;border:0;border-radius:13px;background:#e8f0ff;color:#2563eb;font-size:23px;cursor:pointer}
button.convert{width:100%;height:54px;margin-top:20px;border:0;border-radius:14px;background:#2563eb;color:white;font-size:17px;font-weight:700;cursor:pointer}
.result{margin-top:18px;padding:18px;border-radius:15px;background:#eff6ff;border:1px solid #dbeafe}
.result .small{font-size:13px;color:#64748b;margin-bottom:7px}.result .value{font-size:26px;font-weight:750;color:#1e40af;word-break:break-all}
.copy{margin-top:10px;border:1px solid #bfdbfe;background:white;color:#1d4ed8;border-radius:10px;padding:9px 14px;font-size:14px}
.note{margin-top:16px;color:#64748b;font-size:12px;line-height:1.6}
@media(max-width:390px){.row{grid-template-columns:1fr 44px 1fr}.app{padding:20px 12px}.card{padding:18px}}
</style>
</head>
<body>
<div class="app"><div class="card">
<h1>HFJV 压力单位转换器</h1>
<div class="sub">支持 MPa · bar · psi · kPa · cmH₂O</div>
<label>输入数值</label>
<input id="num" type="number" inputmode="decimal" step="any" value="1" placeholder="请输入数值">
<div class="row">
<div><label>原单位</label><select id="from"></select></div>
<button class="swap" id="swap" aria-label="交换单位">⇄</button>
<div><label>目标单位</label><select id="to"></select></div>
</div>
<button class="convert" id="convert">转换</button>
<div class="result"><div class="small">转换结果</div><div class="value" id="result">—</div><button class="copy" id="copy">复制结果</button></div>
<div class="note">换算基准：1 MPa = 10 bar = 1000 kPa = 145.037738 psi = 1019.716213 cmH₂O</div>
</div></div>
<script>
const units={
  MPa:1,
  bar:0.1,
  kPa:0.001,
  psi:1/145.037738,
  "cmH₂O":1/1019.716213
}; // value is MPa
const names=Object.keys(units);
const from=document.getElementById('from'),to=document.getElementById('to'),num=document.getElementById('num'),result=document.getElementById('result');
for(const u of names){from.add(new Option(u,u));to.add(new Option(u,u))}
from.value='bar';to.value='kPa';
function fmt(x){if(!Number.isFinite(x)) return '请输入有效数值'; return Number(x.toPrecision(12)).toLocaleString('en-US',{maximumFractionDigits:10})+' '+to.value}
function calc(){const x=Number(num.value); if(num.value===''){result.textContent='—';return} result.textContent=fmt(x*units[from.value]/units[to.value]);}
document.getElementById('convert').onclick=calc;
num.addEventListener('input',calc); from.onchange=calc; to.onchange=calc;
document.getElementById('swap').onclick=()=>{const a=from.value;from.value=to.value;to.value=a;calc()};
document.getElementById('copy').onclick=async()=>{if(result.textContent==='—')return; try{await navigator.clipboard.writeText(result.textContent);document.getElementById('copy').textContent='已复制';setTimeout(()=>document.getElementById('copy').textContent='复制结果',1200)}catch(e){}};
calc();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
